<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - GymTracker</title>
</head>
<body>
    <special-header> </special-header>
    
    <main>
        <p>Workouts</p>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button onclick="addWorkout()" "addWorkout">Add Workout</button>
                    <input type="text" id="workoutName" name="workoutName">
            </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button onclick='addExersize()'id="addExersize">Add exersize</button>
                    <input type="text" id="exersizeName" name="exersizeName">
                    <input type="number" id="setNum" placeholder="Sets" class="small-input">
                    <input type="number" id="repNum" placeholder="Reps" class="small-input">
                </div>
            </div>
    </main>

    <special-footer>  </special-footer>
    <script src="headerFooterManager.js"></script>
    <script src="addWorkouts.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styling.css"
</body>
</html>
