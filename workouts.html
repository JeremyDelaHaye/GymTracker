<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - GymTracker</title>
</head>
<body>
    <special-header> </special-header>
    
    <main>
    <p>Create Workout</p>
    <div class="workout-form">

        <input type="text" id="workoutName" placeholder="Workout Name" name="workoutName" class="workout-name-input">

        <div class="add-exercise-row">
            <input type="text" id="exersizeName" placeholder="Exercise Name" name="exersizeName">
            <input type="number" id="setNum" placeholder="Sets" class="small-input">
            <input type="number" id="repNum" placeholder="Reps" class="small-input">
            <button onclick='addExersize()'>Add</button>
        </div>

        <ul id="exerciseList"></ul>

        <button onclick='createWorkout()' class="create-btn">Create Workout</button>

    </div>
</main>

    <special-footer>  </special-footer>
    <script src="headerFooterManager.js"></script>
    <script src="addWorkouts.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styling.css"
</body>
</html>
